project:
  type: website
  output-dir: _site
  render:
    - docs/index.md
    - docs/prereq.md
    - docs/usage.md
    - docs/pipeline.qmd
    - docs/inputs.md
    - docs/outputs.md
    - docs/s3_configuration.md
    - docs/help.md
    - CHANGELOG.md

website:
  title: "CHROMA2 — ATAC-seq Host/Virus Co-analysis Pipeline"
  site-url: https://dremellab.github.io/chroma2/
  repo-url: https://github.com/dremellab/chroma2

  navbar:
    pinned: true
    right:
      - text: "Docs"
        href: docs/index.md
      # Version menu: docs-release.yml auto-patches this whole block during a
      # release build (tag push), setting the pushed version as current and
      # linking back to dev. For dev-branch builds (docs-dev.yml), this
      # checked-in list is used as-is -- add a new entry here after every
      # tagged release so the dev docs dropdown links to it too (older
      # already-built versioned pages are frozen snapshots and can't pick up
      # later additions either way).
      - text: "Version: dev"
        menu:
          - text: "dev (current)"
            href: https://dremellab.github.io/chroma2/dev/docs/index.html
          - text: "2.0.0"
            href: https://dremellab.github.io/chroma2/2.0.0/docs/index.html
      - icon: github
        href: https://github.com/dremellab/chroma2

  sidebar:
    style: floating
    collapse-level: 2
    search: true
    contents:
      - section: "Getting Started"
        contents:
          - docs/index.md
          - docs/prereq.md
          - docs/usage.md
      - section: "Pipeline"
        contents:
          - docs/pipeline.qmd
          - docs/inputs.md
          - docs/outputs.md
      - section: "Cloud & Storage"
        contents:
          - docs/s3_configuration.md
      - section: "Help"
        contents:
          - docs/help.md

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    code-copy: true
    smooth-scroll: true
    mermaid:
      theme: default
    mermaid-format: js
    css: styles.css

metadata:
  version: "dev"
