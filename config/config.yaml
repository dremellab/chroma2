## CHROMA2 config template (placeholders are replaced by the wrapper at init/reconfig)

# The working dir... output will be in the results subfolder of the workdir
workdir: "WORKDIR"

# temporary directory for intermediate files that are not saved
# (wrapper appends a random subfolder under this path)
tempdir: "TEMP_DIR"

# tab delimited samples file ... should have the following columns:
# sampleName\tgroupName\tbatch\tpath_to_R1_fastq\tpath_to_R2_fastq\trole\ttarget\thost_input_pool\tvirus_input_pool
samples: "WORKDIR/samples.tsv"

# select references .... host + viruses(comma-separated):
host: "HOST"
additives: "ADDITIVES"
viruses: "VIRUSES"

## you most probably dont need to change these
scriptsdir: "PIPELINE_HOME/workflow/scripts"
resourcesdir: "PIPELINE_HOME/resources"
fastas_gtfs_dir: "REFS_DIR"

# reference GTF files by host genome (relative to fastas_gtfs_dir unless absolute path)
reference_gtf:
  hg38: "hg38.no_tRNA.gtf"
  mm39: "mm39.no_tRNA.gtf"
  hs1: "hs1.gtf" # this inherently excludes tRNAs

# optional host annotations by host genome (relative to fastas_gtfs_dir unless absolute path)
trnas_gtf:
  hg38: "hg38.tRNAs.hg38chroms.gtf"
  mm39: "mm39.tRNAs.mm39chroms.gtf"
  hs1: "hs1.tRNAs.gtf"
chrr_gtf:
  hg38: "hg38.chrR.gtf"
  mm39: "mm39.chrR.gtf"
  hs1: "hs1.chrR.gtf"
pol3_gtf:
  Pol3_T1:
    hg38: "T1_Genes.hg38.gtf"
    hs1: "T1_Genes.hs1.gtf"
  Pol3_T2:
    hg38: "T2_noAlu.hg38.gtf"
    hs1: "T2_noAlu.hs1.gtf"
  Pol3_T3:
    hg38: "T3_Genes.hg38.gtf"
    hs1: "T3_Genes.hs1.gtf"
repeat_elements_gtf:
  SINE_Alu:
    hg38: "hg38.repeatMasker.SINE_Alu.gtf"
    mm39: "mm39.repeatMasker.SINE_Alu.gtf"
    hs1: "hs1.repeatMasker.SINE_Alu.gtf"
  SINE_MIR:
    hg38: "hg38.repeatMasker.SINE_MIR.gtf"
    mm39: "mm39.repeatMasker.SINE_MIR.gtf"
    hs1: "hs1.repeatMasker.SINE_MIR.gtf"
  LINE_L1:
    hg38: "hg38.repeatMasker.LINE_L1.gtf"
    mm39: "mm39.repeatMasker.LINE_L1.gtf"
    hs1: "hs1.repeatMasker.LINE_L1.gtf"
  LINE_L2:
    hg38: "hg38.repeatMasker.LINE_L2.gtf"
    mm39: "mm39.repeatMasker.LINE_L2.gtf"
    hs1: "hs1.repeatMasker.LINE_L2.gtf"
  LTR:
    hg38: "hg38.repeatMasker.LTR.gtf"
    mm39: "mm39.repeatMasker.LTR.gtf"
    hs1: "hs1.repeatMasker.LTR.gtf"
  other_repeat_elements:
    hg38: "hg38.repeatMasker.other_repeat_elements.gtf"
    mm39: "mm39.repeatMasker.other_repeat_elements.gtf"
    hs1: "hs1.repeatMasker.other_repeat_elements.gtf"
include_trnas_gtf_in_ref: true

# Tn5 count matrices configuration
count_matrices:
  # Gene count matrix: Tn5 insertions around TSS of protein-coding genes (±250bp)
  gene_counts:
    enabled: true
    flank_size: 250
    # Exclude specific gene biotypes from protein-coding gene matrix
    exclude_features: [rRNA, tRNA, Mt_tRNA]
  # tRNA count matrix: Tn5 insertions within tRNA gene bodies (±100bp around midpoint)
  trna_counts:
    enabled: true
    flank_size: 100
    max_size: 1000
  # POL3 count matrices (3 separate: T1, T2, T3)
  # Tn5 insertions within Pol III genes (full feature span, max 1000bp)
  pol3_counts:
    enabled: true
    flank_size: -1 # -1 = full feature span (no flanking)
    max_size: 1000
  # Repeat element count matrices (6 separate per repeat type)
  # Tn5 insertions within repeat elements (full feature span, max 1000bp)
  repeat_element_counts:
    enabled: true
    flank_size: -1 # -1 = full feature span
    max_size: 1000
  # Viral genome bin count matrix (per virus)
  # Tn5 insertions in fixed-size non-overlapping bins across viral genomes
  viral_genome_counts:
    enabled: true
    bin_size: 200
  # rRNA count matrix: Tn5 insertions around TSS of rRNA genes (±250bp)
  rrna_counts:
    enabled: true
    flank_size: 250

# kraken2 db
kraken2_db: "KRAKEN2_DB"

# fastp parameters
fastp:
  length_required: 15
  qualified_quality_phred: 15

# bowtie2 alignment + filtering parameters
bowtie2_align:
  preset: "--very-sensitive"
  k: 20
  max_insert: 2000
  no_mixed: true
  no_discordant: true
  extra_args: ""
  filter:
    include_flag: 2
    exclude_flag: 0x904
    mapq: 30
    exclude_rnames: ["chrM", "MT"]
    markdup_enable: true
    markdup_remove: true

# MACS2 parameters (ATAC-seq)
macs2:
  qvalue: 0.01
  shift: -100
  extsize: 200
  keep_dup: "all"
  extra_args: ""

# pooled input usage for peak calling
peakcalling:
  use_host_input: false
  use_virus_input: true

# Genrich parameters (ATAC-seq)
genrich:
  qvalue: 0.05 # Genrich -q
  remove_dups: true # Genrich -r
  junctions: true # Genrich -j
  exclude_chr: "chrM,MT" # Genrich -e
  virus_exclude_chr: "" # Genrich -e for virus peaks
  blacklist: "" # Genrich -E (BED), empty = skip
  virus_blacklist: "" # Genrich -E (BED) for virus peaks, empty = skip
  host_fraglen: 200 # Genrich -a for host peaks
  virus_fraglen: 100 # Genrich -a for virus peaks
  host_mval: 30 # Genrich -m for host peaks
  virus_mval: 5 # Genrich -m for virus peaks
  fraglen: 500 # legacy Genrich -a (fallback if host/virus not set)
  minlen: 150 # Genrich -l
  maxlen: 1000 # Genrich -g
  extra_args: ""

# postprocessing (BAM split + bigWig)
postprocessing:
  host_bin_size: 50
  virus_bin_size: 1
  host_bw_extra_args: ""
  virus_bw_extra_args: ""

# Tn5 motif extraction
tn5_motif:
  flank_size: 10
  virus_bin_size: 100
  host_gene_flank_size: 250
  trna_gene_flank_size: 100
  trna_gene_max_size: 1000
  mapq_min: 0
  dedup: false
  exclude_secondary: false
  exclude_supplementary: true
  fractional_counting: true
  logo_format: "png"
  generate_logo: false

# ataqv parameters
ataqv:
  extra_args: ""
  virus_tss_extension: 200

# DESeq2 contrast reporting
deseq2:
  enabled: false
  contrasts_tsv: ""
  outdir: "results/deseq2"
  alpha: 0.05
  lfc_threshold: 1.0
  min_replicates_per_group: 2
  min_total_count: 10
  min_features_per_matrix: 50
  size_factor_type: "poscounts"
  fit_type: "parametric"
  shrink_type: "apeglm"
  p_adjust_method: "BH"
  cooks_cutoff: true
  independent_filtering: true
  vst_blind: true
  report_top_n: 50
  report_label_top_n: 15
  report_max_table_rows: 50000
  html_self_contained: true
  design_factors: ["group"]
  # Feature types to skip analysis for (e.g., host, virus, tRNA, ALU, transposable elements)
  # tRNA is skipped by default (insufficient signal in ATAC-seq)
  skip_features:
    - tRNA

# containers
containers:
  fastp: "docker://staphb/fastp:0.24.1"
  fastqc: "docker://seqinfomics/fastqc:0.12.1"
  multiqc: "docker://multiqc/multiqc:v1.25"
  featurecounts: "docker://seqinfomics/featurecounts:2.0.6"
  bowtie2: "docker://seqinfomics/bowtie2:2.5.0"
  bedToBigBed: "docker://seqinfomics/bedtobigbed:latest"
  py311: "docker://seqinfomics/py311:latest"
  pysam: "docker://seqinfomics/pysam:0.22.1"
  macs2: "docker://seqinfomics/macs2:2.2.9.1"
  genrich: "docker://seqinfomics/genrich:0.6.1"
  deeptools: "docker://seqinfomics/deeptools:3.5.6"
  ataqv: "docker://seqinfomics/ataqv:1.3.1"
  deseq2_report: "docker://seqinfomics/deseq2:1.48.2"
  aws: "docker://seqinfomics/aws:1.44.86"

# S3 transfer settings
push_to_s3: false
s3_pipeline_name: "CHROMA"
s3_sample_set_name: ""
s3_aws_credentials_file: "/project/dremel_lab/scripts/aws/credentials"
s3_bucket: "dremel-lab-bucket"
s3_output_prefix: "_HTS"
s3_default_storage_class: "GLACIER_IR"
s3_large_file_storage_class: "GLACIER"
