# Snakemake v8+ profile for Rivanna (SLURM)
# "rivanna" profile

executor: slurm
jobs: 200

# singularity related settings
# --deployment-method apptainer
use-apptainer: true
# harold wrapper points to the shared /project/dremel_lab/workflows/singularity_images SIF directory by default.
apptainer-prefix: /project/dremel_lab/workflows/singularity_images
apptainer-args: --bind /project/dremel_lab:/project/dremel_lab --bind /standard/dremel_lab:/standard/dremel_lab --bind /sfs/gpfs/tardis/project/dremel_lab:/sfs/gpfs/tardis/project/dremel_lab --bind /sfs/ceph/standard/dremel_lab:/sfs/ceph/standard/dremel_lab --bind /sfs/weka/scratch:/sfs/weka/scratch --bind /scratch:/scratch

# debugging and verbosity
# --verbose
verbose: true # is true by default for plugin
# --printshellcmds
printshellcmds: true

# rerun settings
# --rerun-triggers input mtime software-env code
rerun-triggers: [mtime, input, code, software-env]
# rerun-triggers: [mtime, code]
# --rerun-incomplete
rerun-incomplete: true # not parsed via plugin
# do not use --ignore-incomplete
ignore-incomplete: false # set true via plugin

# no parameters
# --notemp
notemp: true # logs of successful jobs are kept .. this is parsed correctly via plugin but logs are still deleted
# do not use --nolock
nolock: false # reset lock to default, plugin sets to true .. but this does not work it is still set to true by plugin
# do not use --no-hooks
no-hooks: false # reset hooks to default, plugin sets to true

# latency and speed related
# --latency-wait 300
latency-wait: 300
# --max-inventory-time 60
max-inventory-time: 60 # plugin parses this correctly as 0 .. trying to reset to default

# Logging settings
slurm-logdir: logs
slurm-keep-successful-logs: true
keep-going: true
restart-times: 3

# report: report.html

# these are not really working ... ignore
jobname: "{rule}.{wildcards}.{jobid}" # job-name errors out ... needs to be jobname
jobscript: config/rivanna/jobscript.sh

# --- Global defaults (from "__default__") ---
default-resources:
  threads: 2 # "__default__.threads"
  mem_mb: 40960 # "__default__.mem" = 40g -> 40*1024 = 40960 MB
  runtime: 240 # "__default__.time" = 4:00:00 -> 240 minutes
  slurm_account: dremel_lab
  slurm_partition: standard
  slurm_ntasks: 1

# --- Per-rule overrides ---

set-threads:
  fastp: 16
  fastqc_raw: 8
  fastqc_trimmed: 8
  bowtie2_index: 8

set-resources:
  fastp:
    mem_mb: 122880
    runtime: 480

  fastqc_raw:
    mem_mb: 122880
    runtime: 240

  fastqc_trimmed:
    mem_mb: 122880
    runtime: 240

  bowtie2_index:
    mem_mb: 122880
    runtime: 240

  bowtie2_align:
    mem_mb: 122880 # 120 GB
    threads: 16
    runtime: 480

  bowtie2_filter:
    mem_mb: 49152 # 48 GB
    threads: 4
    runtime: 480

  alignment_flagstat_summary:
    mem_mb: 8192
    threads: 1
    runtime: 60

  ataqv_host:
    mem_mb: 40960 # 40 GB
    threads: 8
    runtime: 240

  ataqv_virus:
    mem_mb: 40960 # 40 GB
    threads: 8
    runtime: 240

  ataqv_report_host:
    mem_mb: 16384
    threads: 2
    runtime: 120

  ataqv_report_virus:
    mem_mb: 16384
    threads: 2
    runtime: 120

  split_host_bam:
    mem_mb: 40960 # 40 GB
    threads: 4
    runtime: 240

  split_virus_bam:
    mem_mb: 40960 # 40 GB
    threads: 4
    runtime: 240

  bamcoverage_host:
    mem_mb: 122880 # 120 GB
    threads: 8
    runtime: 240

  bamcoverage_virus:
    mem_mb: 122880 # 120 GB
    threads: 8
    runtime: 240

  genrich_atac_callpeak_virus:
    mem_mb: 122880 # 120 GB
    threads: 2
    runtime: 240

  genrich_atac_callpeak_host:
    mem_mb: 122880 # 120 GB
    threads: 2
    runtime: 240
